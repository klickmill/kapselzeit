<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vorlage für den Betreiber.">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Impressum · Kapselzeit</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#ffffff; --rand:#e3e6eb; --text:#111827; --leise:#4b5563; --akzent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#171b22; --rand:#262c36; --text:#e8ebf0; --leise:#9aa3af; --akzent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 48px; }
  .zurueck { display:inline-flex; align-items:center; min-height:44px; color:var(--akzent); font-weight:600; }
  h1 { font-size:1.7rem; margin:8px 0 16px; }
  h2 { font-size:1.15rem; margin:28px 0 8px; }
  a { color:var(--akzent); }
  a:focus-visible { outline:2px solid var(--akzent); outline-offset:2px; }
  .kasten { background:var(--card); border:1px solid var(--rand); border-radius:16px; padding:16px 18px; margin:16px 0; }
  .leise { color:var(--leise); }
  ul { padding-left:1.2em; }
  footer { margin-top:40px; text-align:center; color:var(--leise); font-size:.9rem; }
  footer a { color:var(--leise); }
</style>
</head>
<body>
<main>
  <h1>Impressum</h1>
  <p>Diese Datei ist eine Vorlage. Wer Kapselzeit selbst betreibt, trägt hier die eigenen Pflichtangaben ein (Name, Anschrift, Kontakt). Die Fassung unter klickmill.app/kapselzeit/ enthält die Angaben des dortigen Betreibers.</p>
  <p><a class="zurueck" href="./">Zurück zu Kapselzeit</a></p>
</main>
</body>
</html>
